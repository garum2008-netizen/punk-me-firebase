# PUNK ME safe gang chat — placeholders only. Deploy only after owner GO (Inna).
name = "punk-me-safe-chat"
main = "src/index.js"
compatibility_date = "2025-04-01"

# Free tier: one Durable Object class for per-player rate limits (see SAFE_CHAT_REPORT.md).
[[durable_objects.bindings]]
name = "CHAT_LIMITS"
class_name = "ChatLimitsDO"

# SQLite-backed DO (required on Workers Free; see Cloudflare docs new_sqlite_classes).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatLimitsDO"]

[triggers]
crons = ["0 4 * * *"]

[vars]
FIREBASE_PROJECT_ID = "punk-me-40605"
FIREBASE_DATABASE_URL = "https://punk-me-40605-default-rtdb.europe-west1.firebasedatabase.app"
SAFE_CHAT_FREE_TEXT = "false"
SAFE_CHAT_DAILY_LIMIT = "80"
SAFE_CHAT_REPORT_AUTO_HIDE = "3"
SAFE_CHAT_CORS_ORIGINS = "https://halloween.punk.contractbot.dk"

# Secrets (set via `wrangler secret put`, never commit):
# FIREBASE_SERVICE_ACCOUNT_JSON — Firebase SA with RTDB write (Database Admin)
# MODERATOR_UIDS — comma-separated Firebase Auth UIDs (owner + mods)
# SAFE_CHAT_HASH_SALT — HMAC salt for report pseudonymisation
# Optional: SAFE_CHAT_MOD_ALERT_URL — HTTPS endpoint for immediate-danger alerts (disabled if unset)
# Optional: SAFE_CHAT_WEBHOOK_URL — legacy alias for mod alert URL
