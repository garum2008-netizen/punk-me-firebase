<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { clone as cloneSkinned } from "three/addons/utils/SkeletonUtils.js";

const SHOTS = {
  title: ["Вступай в банду", "Одна ночь. Дом 13. Заслужи нашивку.", "Join the band · Ind i banden"],
  skyline: ["Тыквоград", "Один ларёк горит. Остальной город ещё тёмный.", "Pumpkingrad · Græskarby"],
  house: ["Дом 13", "Ангелина у стены. Ты у лампы.", "Angelina by the wall. You by the lamp. · Angelina ved væggen. Du ved lampen."],
  street: ["Найди Рейзора", "Нашивка у него. Чужому её не дают.", "Find Razor · Find Razor"],
  cemetery: ["Учебный двор", "Здесь учатся цепи. Нашивка не приз.", "Practice yard · Øve-gård"],
  climax: ["Настоящая дуэль", "Ларёк уже стоит. Теперь Рейзор может отдать нашивку.", "The real duel · Den rigtige duel"]
};

const params = new URLSearchParams(location.search);
const shot = params.get("shot") || "title";
document.getElementById("title").textContent = SHOTS[shot][0];
document.getElementById("sub").textContent = SHOTS[shot][1];
document.getElementById("alt").textContent = SHOTS[shot][2];

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(1920, 1080);
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14081f);
scene.fog = new THREE.Fog(0x14081f, 18, 46);
const camera = new THREE.PerspectiveCamera(34, 1920 / 1080, 0.1, 80);

scene.add(new THREE.HemisphereLight(0x6a4a88, 0x120814, 0.85));
const key = new THREE.DirectionalLight(0xfff0e0, 1.15);
key.position.set(-4, 8, 6);
scene.add(key);
const rim = new THREE.DirectionalLight(0xff4ec8, 0.9);
rim.position.set(6, 4, -4);
scene.add(rim);
const cyan = new THREE.DirectionalLight(0x3ad0ff, 0.45);
cyan.position.set(-6, 3, 2);
scene.add(cyan);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(28, 40),
  new THREE.MeshStandardMaterial({ color: 0x1a1024, roughness: 0.95 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

function windows() {
  const c = document.createElement("canvas");
  c.width = 64; c.height = 96;
  const g = c.getContext("2d");
  g.fillStyle = "#1a1028";
  g.fillRect(0, 0, 64, 96);
  const lights = ["#ffd27a", "#ff8ad4", "#7ae7ff", "#1a1028"];
  let n = 0;
  for (let y = 6; y < 90; y += 16) {
    for (let x = 6; x < 58; x += 14) {
      g.fillStyle = lights[(n * 3 + x) % lights.length];
      g.fillRect(x, y, 8, 10);
      n += 1;
    }
  }
  const map = new THREE.CanvasTexture(c);
  map.colorSpace = THREE.SRGBColorSpace;
  return map;
}
const winMap = windows();

function mat(color, extra = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.72, ...extra });
}
function put(mesh, x, y, z, parent) {
  mesh.position.set(x, y, z);
  (parent || scene).add(mesh);
  return mesh;
}
function building(w, h, d, x, z, hue = 0x241433) {
  const group = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(hue));
  body.position.y = h / 2;
  group.add(body);
  const cornice = new THREE.Mesh(new THREE.BoxGeometry(w + 0.18, 0.16, d + 0.12), mat(0x3a2458));
  cornice.position.y = h - 0.08;
  group.add(cornice);
  const door = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.35, 0.08), mat(0x140814, { emissive: 0x7a2060, emissiveIntensity: 0.35 }));
  door.position.set(0, 0.7, d / 2 + 0.05);
  group.add(door);
  const step = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.12, 0.35), mat(0x2a2038));
  step.position.set(0, 0.06, d / 2 + 0.28);
  group.add(step);
  const cols = Math.max(2, Math.floor(w / 0.7));
  const rows = Math.max(2, Math.floor((h - 1.6) / 0.7));
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const on = (r + c + Math.floor(x) + Math.floor(z)) % 3 !== 0;
      const win = new THREE.Mesh(
        new THREE.BoxGeometry(0.28, 0.38, 0.06),
        mat(on ? 0xffe1a0 : 0x120818, { emissive: on ? 0xffb45a : 0x221028, emissiveIntensity: on ? 0.55 : 0.05 })
      );
      win.position.set(-w / 2 + 0.45 + c * ((w - 0.5) / cols), 1.7 + r * 0.7, d / 2 + 0.04);
      group.add(win);
    }
  }
  const awning = new THREE.Mesh(new THREE.BoxGeometry(w * 0.72, 0.08, 0.55), mat(0xff4ec8, { emissive: 0x7a1058, emissiveIntensity: 0.35 }));
  awning.position.set(0, 1.7, d / 2 + 0.28);
  awning.rotation.x = 0.15;
  group.add(awning);
  group.position.set(x, 0, z);
  scene.add(group);
  return group;
}
function lampPost(x, z) {
  put(new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 2.4, 8), mat(0x221018)), x, 1.2, z);
  put(new THREE.Mesh(new THREE.SphereGeometry(0.16, 12, 10), mat(0xfff1c0, { emissive: 0xffc56a, emissiveIntensity: 0.9 })), x, 2.45, z);
  const light = new THREE.PointLight(0xffc56a, 2.4, 8);
  light.position.set(x, 2.3, z);
  scene.add(light);
}
function crate(x, z, s = 1) {
  const g = new THREE.Group();
  g.add(put(new THREE.Mesh(new THREE.BoxGeometry(0.55 * s, 0.4 * s, 0.45 * s), mat(0x6a3a22)), 0, 0.2 * s, 0, g));
  g.position.set(x, 0, z);
  g.rotation.y = (x + z) * 0.4;
  scene.add(g);
}
function fenceRun(x, z, count, yaw = 0) {
  const g = new THREE.Group();
  const iron = mat(0x2c313c, { metalness: 0.45, roughness: 0.4 });
  for (let i = 0; i < count; i++) {
    put(new THREE.Mesh(new THREE.BoxGeometry(0.08, 1.15, 0.08), iron), i * 0.85, 0.57, 0, g);
    put(new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.05, 0.04), iron), i * 0.85 + 0.42, 0.85, 0, g);
    put(new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.05, 0.04), iron), i * 0.85 + 0.42, 0.4, 0, g);
  }
  g.position.set(x, 0, z);
  g.rotation.y = yaw;
  scene.add(g);
}
function tree(x, z, h = 2.4) {
  put(new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.12, 0.8, 6), mat(0x3a2418)), x, 0.4, z);
  const crown = new THREE.Mesh(new THREE.ConeGeometry(0.7, h, 7), mat(0x1d3a28, { emissive: 0x0c2014, emissiveIntensity: 0.2 }));
  crown.position.set(x, 1.1 + h * 0.35, z);
  scene.add(crown);
}
function neonSign(label, x, y, z, color = "#ff4ec8") {
  const c = document.createElement("canvas");
  c.width = 512; c.height = 128;
  const g = c.getContext("2d");
  g.fillStyle = "#120814";
  g.fillRect(0, 0, 512, 128);
  g.strokeStyle = color;
  g.lineWidth = 10;
  g.strokeRect(8, 8, 496, 112);
  g.fillStyle = color;
  g.font = "700 64px Trebuchet MS, sans-serif";
  g.textAlign = "center";
  g.textBaseline = "middle";
  g.fillText(label, 256, 68);
  const map = new THREE.CanvasTexture(c);
  map.colorSpace = THREE.SRGBColorSpace;
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 0.45), new THREE.MeshBasicMaterial({ map }));
  mesh.position.set(x, y, z);
  scene.add(mesh);
  return mesh;
}

function pumpkin(x, z, s = 1) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.SphereGeometry(0.28 * s, 18, 12),
    new THREE.MeshStandardMaterial({ color: 0xff7a18, emissive: 0xff4d00, emissiveIntensity: 0.7, roughness: 0.45 })
  );
  body.scale.y = 0.82;
  const stem = new THREE.Mesh(
    new THREE.CylinderGeometry(0.035 * s, 0.05 * s, 0.16 * s, 6),
    new THREE.MeshStandardMaterial({ color: 0x3c6b28 })
  );
  stem.position.y = 0.26 * s;
  g.add(body, stem);
  g.position.set(x, 0.22 * s, z);
  scene.add(g);
  const light = new THREE.PointLight(0xff7a18, 3.2 * s, 7);
  light.position.set(x, 1.1, z);
  scene.add(light);
}

function moon() {
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(1.4, 24, 16),
    new THREE.MeshBasicMaterial({ color: 0xfff1c9 })
  );
  m.position.set(-10, 11, -22);
  scene.add(m);
}

function stall(x, z) {
  const g = new THREE.Group();
  const wood = mat(0x6a3a22);
  const top = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.12, 0.9), wood);
  top.position.y = 1.0;
  g.add(top);
  [[-0.95, -0.32], [0.95, -0.32], [-0.95, 0.32], [0.95, 0.32]].forEach(([lx, lz]) => {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.95, 0.1), wood);
    leg.position.set(lx, 0.48, lz);
    g.add(leg);
  });
  for (let i = 0; i < 7; i++) {
    const stripe = new THREE.Mesh(
      new THREE.BoxGeometry(0.28, 0.06, 1.15),
      mat(i % 2 ? 0xff7a18 : 0xff4ec8, { emissive: i % 2 ? 0x8a3200 : 0x7a1058, emissiveIntensity: 0.35 })
    );
    stripe.position.set(-0.9 + i * 0.3, 1.55, 0);
    stripe.rotation.z = -0.08;
    g.add(stripe);
  }
  for (let i = 0; i < 3; i++) {
    const jar = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.09, 0.22, 8), mat(0xffe1a0, { emissive: 0xffb45a, emissiveIntensity: 0.25 }));
    jar.position.set(-0.45 + i * 0.28, 1.16, 0.1);
    g.add(jar);
  }
  const crateBox = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.28, 0.35), wood);
  crateBox.position.set(0.7, 1.2, -0.05);
  g.add(crateBox);
  g.position.set(x, 0, z);
  scene.add(g);
  pumpkin(x + 0.15, z + 0.7, 0.65);
  neonSign("ЛАРЁК", x, 2.05, z + 0.2);
}

function stones() {
  const stone = mat(0x3c4454);
  [[-4.2, -2.2, 0.9], [-2.8, -3.2, 1.25], [-1.2, -2.6, 0.7], [1.4, -3.4, 1.4], [2.8, -2.5, 0.85], [4.1, -3.1, 1.15], [-3.4, -4.4, 1.0], [0.2, -4.6, 1.3]].forEach(([x, z, h]) => {
    put(new THREE.Mesh(new THREE.BoxGeometry(0.62, h, 0.18), stone), x, h / 2, z);
    const cap = new THREE.Mesh(new THREE.SphereGeometry(0.22, 10, 8), stone);
    cap.scale.y = 0.45;
    cap.position.set(x, h + 0.05, z);
    scene.add(cap);
  });
  fenceRun(-4.6, -5.2, 12, 0.05);
  tree(-5.2, -1.4, 2.2);
  tree(5.0, -1.8, 2.6);
  tree(-3.6, -5.6, 1.8);
  const path = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.04, 8), mat(0x2a2433));
  path.position.set(0, 0.02, -1);
  scene.add(path);
}

function chainBetween(a, b) {
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: 0xf0d080, metalness: 0.6, roughness: 0.35, emissive: 0x8a6a20, emissiveIntensity: 0.25 });
  const steps = 7;
  for (let i = 0; i < steps; i++) {
    const t = (i + 1) / (steps + 1);
    const link = new THREE.Mesh(new THREE.TorusGeometry(0.07, 0.02, 8, 12), mat);
    link.position.set(
      a.x + (b.x - a.x) * t,
      0.72 + Math.sin(t * Math.PI) * 0.12,
      a.z + (b.z - a.z) * t
    );
    link.rotation.y = i % 2 ? 0 : Math.PI / 2;
    g.add(link);
  }
  scene.add(g);
}

function badge(x, y, z) {
  const g = new THREE.Group();
  const disc = new THREE.Mesh(
    new THREE.CylinderGeometry(0.11, 0.11, 0.03, 20),
    new THREE.MeshStandardMaterial({ color: 0xffd56a, emissive: 0xc47a00, emissiveIntensity: 0.45, metalness: 0.35, roughness: 0.4 })
  );
  disc.rotation.z = Math.PI / 2;
  g.add(disc);
  g.position.set(x, y, z);
  scene.add(g);
}

const loader = new GLTFLoader();
const mixers = [];

async function hero(url) {
  const gltf = await loader.loadAsync(url);
  const root = cloneSkinned(gltf.scene);
  root.traverse(o => {
    if (o.isMesh) {
      o.castShadow = true;
      o.frustumCulled = false;
    }
  });
  root.updateMatrixWorld(true);
  let headY = 1.6;
  let footY = 0;
  root.traverse(o => {
    if (!o.isBone) return;
    const p = new THREE.Vector3();
    o.getWorldPosition(p);
    if (/HeadTop/i.test(o.name)) headY = p.y;
    if (/Foot$/i.test(o.name)) footY = Math.min(footY || p.y, p.y);
  });
  const s = 1.62 / Math.max(headY, 0.2);
  root.scale.setScalar(s);
  root.position.y -= footY * s;
  root.updateMatrixWorld(true);
  const group = new THREE.Group();
  group.visible = false;
  group.add(root);
  const mixer = new THREE.AnimationMixer(root);
  const clip = (gltf.animations || []).find(a => /idle/i.test(a.name)) || gltf.animations?.[0];
  if (clip) mixer.clipAction(clip).play();
  mixers.push(mixer);
  scene.add(group);
  return group;
}

function place(group, x, z, yaw) {
  group.visible = true;
  group.position.set(x, 0, z);
  group.rotation.y = yaw;
}

const pink = await hero("/assets/models/meshy/punk_pink.glb");
const cobalt = await hero("/assets/models/meshy/cobalt.glb");
const razor = await hero("/assets/models/meshy/razor.glb");
const mohawk = await hero("/assets/models/meshy/mohawk.glb");

function streetDressing() {
  lampPost(-3.4, 1.6);
  lampPost(3.6, 1.3);
  pumpkin(-2.2, 1.55, 0.9);
  pumpkin(2.5, 1.7, 0.75);
  crate(-3.8, 0.4);
  crate(3.9, 0.55, 0.8);
  crate(4.2, 0.9, 0.6);
  fenceRun(-6.2, -1.2, 4, Math.PI / 2);
  fenceRun(4.8, -1.4, 4, Math.PI / 2);
}
moon();
if (shot === "title") {
  building(3.4, 5.4, 2.6, -6.4, -7, 0x2a1844);
  building(2.6, 8.2, 2.4, -2.4, -9.2);
  building(3.6, 4.8, 2.8, 3.2, -7.4, 0x311848);
  building(2.4, 6.6, 2.2, 7.0, -6.6);
  neonSign("ДОМ 13", -2.2, 3.4, -5.6);
  streetDressing();
  place(pink, -2.15, 0.2, 0.2);
  place(razor, -0.7, 0.4, 0.05);
  place(cobalt, 0.75, 0.2, -0.08);
  place(mohawk, 2.15, 0.45, -0.15);
  camera.position.set(0.1, 1.35, 7.4);
  camera.lookAt(0.1, 1.05, 0);
} else if (shot === "skyline") {
  [[-11, 7.2, -16], [-7.2, 10, -18], [-3.2, 6.2, -15], [1.2, 12, -19], [5.4, 8, -16], [9.2, 6.4, -15], [12.4, 9, -17]].forEach((b, i) => {
    building(2.5 + (i % 2) * 0.5, b[1], 2.3, b[0], b[2], i % 2 ? 0x2a1840 : 0x1c1230);
  });
  stall(0.1, 0.2);
  lampPost(-3.6, 2.2);
  lampPost(3.8, 2.0);
  crate(-2.6, 1.5);
  crate(2.4, 1.7, 0.85);
  pumpkin(-4.2, 1.1);
  pumpkin(4.0, 1.3, 0.8);
  place(cobalt, -1.55, 2.35, 0.1);
  place(pink, 1.7, 2.5, -0.05);
  camera.position.set(0.2, 2.15, 8.6);
  camera.lookAt(0.2, 1.6, -1);
} else if (shot === "house") {
  const wallMat = mat(0x2a1840);
  const back = new THREE.Mesh(new THREE.BoxGeometry(8.4, 3.4, 0.18), wallMat);
  back.position.set(0, 1.7, -2.7);
  scene.add(back);
  const left = new THREE.Mesh(new THREE.BoxGeometry(0.18, 3.4, 5), wallMat);
  left.position.set(-4.1, 1.7, -0.4);
  scene.add(left);
  const rug = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.03, 2.1), mat(0x5a2048));
  rug.position.set(0, 0.02, 0.2);
  scene.add(rug);
  const poster = new THREE.Mesh(new THREE.PlaneGeometry(1.15, 1.5), new THREE.MeshBasicMaterial({ map: winMap }));
  poster.position.set(-2.55, 1.7, -2.55);
  scene.add(poster);
  const shelf = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.08, 0.28), mat(0x4a3020));
  shelf.position.set(-2.5, 2.55, -2.5);
  scene.add(shelf);
  for (let i = 0; i < 4; i++) {
    const book = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.32, 0.2), mat(i % 2 ? 0xff4ec8 : 0x3ad0ff));
    book.position.set(-2.9 + i * 0.22, 2.76, -2.5);
    scene.add(book);
  }
  const bed = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.32, 0.9), mat(0x6a2458));
  bed.position.set(2.5, 0.2, -1.55);
  scene.add(bed);
  const pillow = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.16, 0.35), mat(0xffe1a8));
  pillow.position.set(3.05, 0.42, -1.55);
  scene.add(pillow);
  const windowFrame = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 1.1), new THREE.MeshBasicMaterial({ map: winMap }));
  windowFrame.position.set(1.1, 2.15, -2.58);
  scene.add(windowFrame);
  put(new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.06, 1.55, 8), mat(0x221018)), 2.15, 0.78, 0.15);
  put(new THREE.Mesh(new THREE.ConeGeometry(0.32, 0.24, 12), mat(0xffe1a8, { emissive: 0xffb45a, emissiveIntensity: 0.85 })), 2.15, 1.6, 0.15);
  const lamp = new THREE.PointLight(0xffc56a, 5, 7);
  lamp.position.set(2.15, 1.7, 0.35);
  scene.add(lamp);
  place(pink, -1.7, 0.15, 0.15);
  place(cobalt, 1.15, 0.35, -0.05);
  camera.position.set(-0.1, 1.25, 4.8);
  camera.lookAt(0.1, 1.0, 0);
} else if (shot === "street") {
  building(3.2, 4.6, 2.2, -4.8, -5.4, 0x2a1844);
  building(4.4, 3.8, 2.4, 3.4, -5.2, 0x311848);
  neonSign("РЕЙЗОР", 3.1, 2.55, -3.7);
  streetDressing();
  crate(1.6, 1.2, 0.7);
  place(razor, 0.85, 0.15, 0);
  place(pink, -1.15, 0.85, 0.2);
  place(cobalt, -2.35, 1.25, 0.05);
  camera.position.set(-0.3, 1.35, 6.8);
  camera.lookAt(0, 1.05, 0);
} else if (shot === "cemetery") {
  stones();
  lampPost(-3.3, 0.4);
  lampPost(3.4, 0.2);
  pumpkin(-2.4, 1.3, 0.85);
  pumpkin(2.5, 1.15, 0.8);
  pumpkin(0.2, -2.4, 0.55);
  place(cobalt, -0.95, 0.4, 0.35);
  place(razor, 0.95, 0.4, -0.35);
  chainBetween(cobalt.position, razor.position);
  camera.position.set(0, 1.4, 6.4);
  camera.lookAt(0, 1.0, 0);
} else {
  building(2.4, 8.4, 2.2, -7.2, -12);
  building(2.8, 10.5, 2.2, 6.8, -13, 0x311848);
  building(2.2, 6.2, 2, -2.4, -14);
  stall(0, -2.6);
  lampPost(-3.2, -0.4);
  lampPost(3.3, -0.6);
  crate(-2.2, 0.8);
  pumpkin(2.2, 0.6, 0.7);
  place(cobalt, -0.95, 0.55, 0.15);
  place(razor, 0.85, 0.35, -0.1);
  chainBetween(cobalt.position, razor.position);
  badge(1.35, 1.15, 0.55);
  camera.position.set(0, 1.4, 6.6);
  camera.lookAt(0, 1.05, -0.8);
}

let frames = 0;
function tick() {
  mixers.forEach(m => m.update(1 / 30));
  renderer.render(scene, camera);
  frames += 1;
  if (frames < 8) requestAnimationFrame(tick);
  else window.__keyArtReady = shot;
}
tick();
</script>
