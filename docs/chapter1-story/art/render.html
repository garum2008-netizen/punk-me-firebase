<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chapter 1 key art</title>
<style>
  html, body { margin: 0; background: #07010f; overflow: hidden; }
  canvas { display: block; }
  #plate {
    position: absolute; inset: 0; pointer-events: none;
    font-family: "Trebuchet MS", "Segoe UI", sans-serif; color: #fff;
  }
  #kicker {
    position: absolute; left: 56px; top: 36px;
    letter-spacing: 0.22em; font-weight: 800; font-size: 22px; color: #ffb4ea;
  }
  #caption {
    position: absolute; left: 56px; right: 56px; bottom: 40px;
    text-shadow: 0 6px 24px #000;
  }
  #caption h1 { margin: 0; font-size: 68px; line-height: 0.95; letter-spacing: 0.02em; }
  #caption p { margin: 12px 0 0; font-size: 28px; max-width: 980px; color: #ffe9a8; }
</style>
</head>
<body>
<div id="plate">
  <div id="kicker">PUNK ME · CHAPTER 1</div>
  <div id="caption"><h1 id="title"></h1><p id="sub"></p></div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { clone as cloneSkinned } from "three/addons/utils/SkeletonUtils.js";

const SHOTS = {
  title: ["Join the band", "One night. House 13. Earn the patch."],
  skyline: ["Pumpkingrad", "One stall is lit. The rest of the city is still dark."],
  house: ["House 13", "This room is yours. Angelina waits by the lamp."],
  street: ["Find Razor", "He keeps the patch. A stranger does not get it."],
  cemetery: ["Practice duel", "Win here to learn the chains. The patch is not the prize."],
  climax: ["The real duel", "Your stall is standing. Now Razor can give you the patch."]
};

const params = new URLSearchParams(location.search);
const shot = params.get("shot") || "title";
document.getElementById("title").textContent = SHOTS[shot][0];
document.getElementById("sub").textContent = SHOTS[shot][1];

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(1920, 1080);
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14081f);
scene.fog = new THREE.Fog(0x14081f, 18, 46);
const camera = new THREE.PerspectiveCamera(34, 1920 / 1080, 0.1, 80);

scene.add(new THREE.HemisphereLight(0x6a4a88, 0x120814, 0.85));
const key = new THREE.DirectionalLight(0xfff0e0, 1.15);
key.position.set(-4, 8, 6);
scene.add(key);
const rim = new THREE.DirectionalLight(0xff4ec8, 0.9);
rim.position.set(6, 4, -4);
scene.add(rim);
const cyan = new THREE.DirectionalLight(0x3ad0ff, 0.45);
cyan.position.set(-6, 3, 2);
scene.add(cyan);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(28, 40),
  new THREE.MeshStandardMaterial({ color: 0x1a1024, roughness: 0.95 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

function windows() {
  const c = document.createElement("canvas");
  c.width = 64; c.height = 96;
  const g = c.getContext("2d");
  g.fillStyle = "#1a1028";
  g.fillRect(0, 0, 64, 96);
  const lights = ["#ffd27a", "#ff8ad4", "#7ae7ff", "#1a1028"];
  let n = 0;
  for (let y = 6; y < 90; y += 16) {
    for (let x = 6; x < 58; x += 14) {
      g.fillStyle = lights[(n * 3 + x) % lights.length];
      g.fillRect(x, y, 8, 10);
      n += 1;
    }
  }
  const map = new THREE.CanvasTexture(c);
  map.colorSpace = THREE.SRGBColorSpace;
  return map;
}
const winMap = windows();

function building(w, h, d, x, z) {
  const group = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    new THREE.MeshStandardMaterial({ color: 0x241433, roughness: 0.82 })
  );
  body.position.y = h / 2;
  const face = new THREE.Mesh(
    new THREE.PlaneGeometry(w * 0.82, h * 0.72),
    new THREE.MeshBasicMaterial({ map: winMap })
  );
  face.position.set(0, h * 0.55, d / 2 + 0.03);
  group.add(body, face);
  group.position.set(x, 0, z);
  scene.add(group);
  return group;
}

function pumpkin(x, z, s = 1) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.SphereGeometry(0.28 * s, 18, 12),
    new THREE.MeshStandardMaterial({ color: 0xff7a18, emissive: 0xff4d00, emissiveIntensity: 0.7, roughness: 0.45 })
  );
  body.scale.y = 0.82;
  const stem = new THREE.Mesh(
    new THREE.CylinderGeometry(0.035 * s, 0.05 * s, 0.16 * s, 6),
    new THREE.MeshStandardMaterial({ color: 0x3c6b28 })
  );
  stem.position.y = 0.26 * s;
  g.add(body, stem);
  g.position.set(x, 0.22 * s, z);
  scene.add(g);
  const light = new THREE.PointLight(0xff7a18, 3.2 * s, 7);
  light.position.set(x, 1.1, z);
  scene.add(light);
}

function moon() {
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(1.4, 24, 16),
    new THREE.MeshBasicMaterial({ color: 0xfff1c9 })
  );
  m.position.set(-10, 11, -22);
  scene.add(m);
}

function stall(x, z) {
  const g = new THREE.Group();
  const wood = new THREE.MeshStandardMaterial({ color: 0x6a3a22, roughness: 0.7 });
  const top = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.12, 0.8), wood);
  top.position.y = 0.95;
  const leg = new THREE.BoxGeometry(0.1, 0.9, 0.1);
  [[-0.75, -0.3], [0.75, -0.3], [-0.75, 0.3], [0.75, 0.3]].forEach(([lx, lz]) => {
    const mesh = new THREE.Mesh(leg, wood);
    mesh.position.set(lx, 0.45, lz);
    g.add(mesh);
  });
  const cloth = new THREE.Mesh(
    new THREE.BoxGeometry(2.1, 0.08, 1.05),
    new THREE.MeshStandardMaterial({ color: 0xff4ec8, emissive: 0x7a1058, emissiveIntensity: 0.4 })
  );
  cloth.position.set(0, 1.35, 0);
  cloth.rotation.z = 0.08;
  g.add(top, cloth);
  g.position.set(x, 0, z);
  scene.add(g);
  pumpkin(x + 0.35, z + 0.55, 0.7);
}

function stones() {
  const mat = new THREE.MeshStandardMaterial({ color: 0x3a4150, roughness: 0.9 });
  [[-3.2, -2.4, 0.7], [-1.6, -3.1, 1.05], [1.8, -2.6, 0.8], [3.1, -3.4, 1.2]].forEach(([x, z, h]) => {
    const s = new THREE.Mesh(new THREE.BoxGeometry(0.55, h, 0.16), mat);
    s.position.set(x, h / 2, z);
    scene.add(s);
  });
}

function chainBetween(a, b) {
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: 0xf0d080, metalness: 0.6, roughness: 0.35, emissive: 0x8a6a20, emissiveIntensity: 0.25 });
  const steps = 7;
  for (let i = 0; i < steps; i++) {
    const t = (i + 1) / (steps + 1);
    const link = new THREE.Mesh(new THREE.TorusGeometry(0.07, 0.02, 8, 12), mat);
    link.position.set(
      a.x + (b.x - a.x) * t,
      0.72 + Math.sin(t * Math.PI) * 0.12,
      a.z + (b.z - a.z) * t
    );
    link.rotation.y = i % 2 ? 0 : Math.PI / 2;
    g.add(link);
  }
  scene.add(g);
}

function badge(x, y, z) {
  const g = new THREE.Group();
  const disc = new THREE.Mesh(
    new THREE.CylinderGeometry(0.11, 0.11, 0.03, 20),
    new THREE.MeshStandardMaterial({ color: 0xffd56a, emissive: 0xc47a00, emissiveIntensity: 0.45, metalness: 0.35, roughness: 0.4 })
  );
  disc.rotation.z = Math.PI / 2;
  g.add(disc);
  g.position.set(x, y, z);
  scene.add(g);
}

const loader = new GLTFLoader();
const mixers = [];

async function hero(url) {
  const gltf = await loader.loadAsync(url);
  const root = cloneSkinned(gltf.scene);
  root.traverse(o => {
    if (o.isMesh) {
      o.castShadow = true;
      o.frustumCulled = false;
    }
  });
  root.updateMatrixWorld(true);
  let headY = 1.6;
  let footY = 0;
  root.traverse(o => {
    if (!o.isBone) return;
    const p = new THREE.Vector3();
    o.getWorldPosition(p);
    if (/HeadTop/i.test(o.name)) headY = p.y;
    if (/Foot$/i.test(o.name)) footY = Math.min(footY || p.y, p.y);
  });
  const s = 1.62 / Math.max(headY, 0.2);
  root.scale.setScalar(s);
  root.position.y -= footY * s;
  root.updateMatrixWorld(true);
  const group = new THREE.Group();
  group.visible = false;
  group.add(root);
  const mixer = new THREE.AnimationMixer(root);
  const clip = (gltf.animations || []).find(a => /idle/i.test(a.name)) || gltf.animations?.[0];
  if (clip) mixer.clipAction(clip).play();
  mixers.push(mixer);
  scene.add(group);
  return group;
}

function place(group, x, z, yaw) {
  group.visible = true;
  group.position.set(x, 0, z);
  group.rotation.y = yaw;
}

const pink = await hero("/assets/models/meshy/punk_pink.glb");
const cobalt = await hero("/assets/models/meshy/cobalt.glb");
const razor = await hero("/assets/models/meshy/razor.glb");
const mohawk = await hero("/assets/models/meshy/mohawk.glb");

moon();
if (shot === "title") {
  building(3.2, 5.2, 2.4, -6.2, -6);
  building(2.4, 7.4, 2.2, -2.2, -8.5);
  building(3.4, 4.6, 2.6, 3.4, -7.2);
  building(2.2, 6.2, 2, 7.2, -6.4);
  pumpkin(-2.4, 1.2);
  pumpkin(2.6, 1.4, 0.8);
  place(pink, -2.15, 0.15, 0.2);
  place(razor, -0.7, 0.35, 0.05);
  place(cobalt, 0.75, 0.15, -0.08);
  place(mohawk, 2.15, 0.4, -0.18);
  camera.position.set(0.1, 1.25, 6.8);
  camera.lookAt(0.1, 0.95, 0);
} else if (shot === "skyline") {
  [[-12, 6.5, -14], [-8, 9, -16], [-4, 5.5, -13], [0, 11, -18], [4, 7, -14], [8, 8.5, -16], [12, 5, -13]].forEach((b, i) => {
    building(2.4 + (i % 3) * 0.4, b[1], 2.2, b[0], b[2]);
  });
  stall(0.2, -1.2);
  pumpkin(-3.5, 0.4);
  pumpkin(3.2, 0.2, 1.1);
  place(cobalt, -1.4, 2.2, 0.15);
  place(pink, 1.5, 2.4, -0.1);
  camera.position.set(0, 2.6, 12.5);
  camera.lookAt(0, 2.4, -4);
} else if (shot === "house") {
  const wall = new THREE.Mesh(
    new THREE.BoxGeometry(9, 3.6, 0.2),
    new THREE.MeshStandardMaterial({ color: 0x2a1840 })
  );
  wall.position.set(0, 1.8, -2.6);
  scene.add(wall);
  const poster = new THREE.Mesh(
    new THREE.PlaneGeometry(1.1, 1.4),
    new THREE.MeshBasicMaterial({ map: winMap })
  );
  poster.position.set(-2.4, 1.6, -2.45);
  scene.add(poster);
  const bed = new THREE.Mesh(
    new THREE.BoxGeometry(1.8, 0.35, 0.9),
    new THREE.MeshStandardMaterial({ color: 0x5a2048 })
  );
  bed.position.set(2.3, 0.2, -1.5);
  scene.add(bed);
  const lamp = new THREE.PointLight(0xffc56a, 6, 8);
  lamp.position.set(1.6, 2.2, -1.2);
  scene.add(lamp);
  const shade = new THREE.Mesh(
    new THREE.ConeGeometry(0.28, 0.22, 12),
    new THREE.MeshStandardMaterial({ color: 0xffe1a8, emissive: 0xffb45a, emissiveIntensity: 0.8 })
  );
  shade.position.set(1.6, 2.15, -1.2);
  scene.add(shade);
  const pole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.04, 0.05, 1.5, 8),
    new THREE.MeshStandardMaterial({ color: 0x221018 })
  );
  pole.position.set(1.6, 0.75, -1.2);
  scene.add(pole);
  place(pink, -0.85, 0.15, 0.2);
  place(cobalt, 0.75, 0.45, -0.1);
  camera.position.set(0, 1.2, 5.2);
  camera.lookAt(0, 0.95, 0);
} else if (shot === "street") {
  building(3, 4.2, 2, -4.5, -5);
  building(4.2, 3.4, 2.2, 3.6, -4.6);
  const sign = new THREE.Mesh(
    new THREE.BoxGeometry(1.6, 0.36, 0.08),
    new THREE.MeshStandardMaterial({ color: 0x141018, emissive: 0xff4ec8, emissiveIntensity: 0.7 })
  );
  sign.position.set(3.2, 2.4, -3.3);
  scene.add(sign);
  pumpkin(2.2, 0.8);
  place(razor, 0.35, 0.1, 0.05);
  place(pink, -1.35, 0.7, 0.25);
  place(cobalt, -2.45, 1.15, 0.1);
  camera.position.set(-0.2, 1.25, 6.2);
  camera.lookAt(-0.2, 0.95, 0);
} else if (shot === "cemetery") {
  stones();
  pumpkin(-2.2, -1.2, 0.9);
  pumpkin(2.4, -1.4, 0.8);
  place(cobalt, -0.85, 0.35, 0.4);
  place(razor, 0.85, 0.35, -0.4);
  chainBetween(cobalt.position, razor.position);
  camera.position.set(0, 1.25, 5.6);
  camera.lookAt(0, 0.95, 0.2);
} else {
  building(2.2, 8, 2, -7, -12);
  building(2.6, 10, 2, 6.5, -13);
  stall(0, -3.4);
  place(razor, 0.7, 0.25, -0.15);
  place(cobalt, -0.85, 0.45, 0.2);
  chainBetween(cobalt.position, razor.position);
  badge(1.15, 1.15, 0.35);
  camera.position.set(0, 1.3, 5.8);
  camera.lookAt(0, 1.0, -0.6);
}

let frames = 0;
function tick() {
  mixers.forEach(m => m.update(1 / 30));
  renderer.render(scene, camera);
  frames += 1;
  if (frames < 8) requestAnimationFrame(tick);
  else window.__keyArtReady = shot;
}
tick();
</script>
</body>
</html>
