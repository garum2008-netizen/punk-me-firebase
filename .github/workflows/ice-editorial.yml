name: ICE editorial

on:
  pull_request:
    paths:
      - ice-editorial/**
      - ice-buffer/**
      - .github/workflows/ice-editorial.yml
  push:
    paths:
      - ice-editorial/**
      - ice-buffer/**
      - .github/workflows/ice-editorial.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm run test:ice
