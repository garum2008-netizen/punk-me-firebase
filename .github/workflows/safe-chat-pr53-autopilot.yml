name: Safe Chat PR53 autopilot verify

# Authoritative CI runner: npm ci + isolated port hygiene + full test:safe-chat streak.
# Do not treat integration-only green as PASS; suite exit code is the gate.

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Git ref to verify (branch, tag, or SHA)"
        required: true
        default: "cursor/safe-chat-verifier-fixes-3dff"
      frozen_security_sha:
        description: "Frozen Safe Chat security commit (worker logic); informational gate"
        required: true
        default: "d31a624cdf407fac20c1560958dd426a6c174b39"
      streak:
        description: "Consecutive full-suite runs required (default 3)"
        required: true
        default: "3"
  pull_request:
    types: [labeled]
    branches: [main]

concurrency:
  group: safe-chat-pr53-autopilot-${{ github.event.inputs.git_ref || github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'safe-chat-autopilot'))
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref || github.head_ref }}
          fetch-depth: 0

      - name: Record environment metadata
        run: |
          mkdir -p .cursor/ci-artifacts
          node -e "
          const fs=require('fs');
          const {execSync}=require('child_process');
          const meta={
            runner:'github-actions',
            image: process.env.ImageOS || 'ubuntu-latest',
            node: process.version,
            ref: execSync('git rev-parse HEAD').toString().trim(),
            frozenSecuritySha: '${{ github.event.inputs.frozen_security_sha || 'd31a624cdf407fac20c1560958dd426a6c174b39' }}',
            workerContainsFrozen: execSync('git merge-base --is-ancestor ${{ github.event.inputs.frozen_security_sha || 'd31a624cdf407fac20c1560958dd426a6c174b39' }} HEAD && echo yes || echo no').toString().trim(),
            startedAt: new Date().toISOString()
          };
          fs.writeFileSync('.cursor/ci-artifacts/env-metadata.json', JSON.stringify(meta,null,2));
          console.log(JSON.stringify(meta,null,2));
          "

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workers/safe-chat/package-lock.json

      - name: npm ci (root + safe-chat worker)
        run: |
          npm ci
          npm ci --prefix workers/safe-chat

      - name: Full safe-chat verification streak
        env:
          SAFE_CHAT_INTEGRATION: "1"
          SAFE_CHAT_STREAK: ${{ github.event.inputs.streak || '3' }}
        run: bash scripts/run-3x-safe-chat-verify.sh

      - name: Upload logs and checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safe-chat-pr53-${{ github.run_id }}
          path: |
            .cursor/autopilot-3x-*.txt
            .cursor/3x-run*.log
            .cursor/autopilot-checkpoint.json
            .cursor/ci-artifacts/
          if-no-files-found: warn
