name: Preview Pages

# Closed preview only. This updates punk-me-ch1-preview, never the production game.
on:
  workflow_dispatch:
  push:
    branches:
      - cursor/chapter1-ship-c480

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Require Cloudflare preview secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "MISSING secret CLOUDFLARE_API_TOKEN (repository Actions secrets)"
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "MISSING secret CLOUDFLARE_ACCOUNT_ID (repository Actions secrets)"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Pages git integration is not connected on project punk-me-ch1-preview."
            echo "Environment github-pages is the only GitHub environment and is not a Cloudflare environment."
            exit 1
          fi
          echo "Cloudflare preview secrets are present"
      - run: node scripts/build-preview.js
      - name: Deploy closed preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy dist-preview \
            --project-name punk-me-ch1-preview \
            --branch preview-ch1 \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "closed preview $GITHUB_SHA"
