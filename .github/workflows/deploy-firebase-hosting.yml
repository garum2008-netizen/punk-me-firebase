name: Deploy Firebase Hosting

on:
  push:
    branches: [main]
    paths:
      - index.html
      - css/**
      - js/**
      - data/**
      - imagine_images/**
      - assets/**

jobs:
  hosting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g firebase-tools
      - run: firebase deploy --only hosting --project punk-me-40605 --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
