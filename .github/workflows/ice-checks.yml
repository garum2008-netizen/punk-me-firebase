name: ICE checks

on:
  pull_request:
  push:
    branches:
      - cursor/ice-case-library-c480

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python3 -m unittest ice.tests.test_library ice.tests.test_factory -q
      - run: node --test ice-buffer/visual-media-gate.test.mjs
